name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-venv \
            build-essential autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install buildozer cython

      - name: Install Android build tools (aidl)
        run: |
          yes | sdkmanager --licenses
          # Buildozer expects legacy tools/bin/sdkmanager path.
          # New Android SDKs provide sdkmanager under cmdline-tools/*/bin.
          mkdir -p /usr/local/lib/android/sdk/tools/bin
          if [ -f /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager ]; then
            sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager
          elif [ -f /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager ]; then
            sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager
          fi
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "build-tools;33.0.2" \
            "build-tools;30.0.3"
          test -f /usr/local/lib/android/sdk/build-tools/34.0.0/aidl
          sudo ln -sf /usr/local/lib/android/sdk/build-tools/34.0.0/aidl /usr/local/bin/aidl
          aidl --version || true

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROIDSDK: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_SDK_ROOT/build-tools/34.0.0:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: safedrive-apk
          path: bin/*.apk
          if-no-files-found: error
